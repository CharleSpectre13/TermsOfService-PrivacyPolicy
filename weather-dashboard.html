<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 1200px;
        }

        h1 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .search-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            justify-content: center;
        }

        .search-bar input {
            padding: 12px 20px;
            font-size: 1em;
            border: none;
            border-radius: 25px;
            width: 300px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
        }

        .search-bar input:focus {
            outline: none;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }

        .search-bar button {
            padding: 12px 30px;
            font-size: 1em;
            background-color: #ff6b6b;
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
            font-weight: 600;
        }

        .search-bar button:hover {
            background-color: #ff5252;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }

        .weather-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .weather-card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
        }

        .weather-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15);
        }

        .weather-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 20px;
        }

        .city-info h2 {
            font-size: 1.8em;
            color: #333;
            margin-bottom: 5px;
        }

        .city-info p {
            color: #666;
            font-size: 0.95em;
        }

        .temp-display {
            text-align: right;
        }

        .temperature {
            font-size: 3em;
            font-weight: bold;
            color: #667eea;
        }

        .weather-description {
            color: #666;
            font-size: 1.1em;
            margin: 20px 0;
            text-transform: capitalize;
        }

        .weather-icon {
            font-size: 4em;
            margin: 20px 0;
            text-align: center;
        }

        .details-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-top: 20px;
        }

        .detail {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 10px;
        }

        .detail-label {
            color: #999;
            font-size: 0.85em;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .detail-value {
            font-size: 1.3em;
            font-weight: 600;
            color: #333;
        }

        .forecast {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
        }

        .forecast h3 {
            font-size: 1.5em;
            color: #333;
            margin-bottom: 20px;
        }

        .forecast-items {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 15px;
        }

        .forecast-item {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px;
            border-radius: 15px;
            text-align: center;
            transition: all 0.3s ease;
        }

        .forecast-item:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }

        .forecast-day {
            font-weight: 600;
            margin-bottom: 10px;
        }

        .forecast-icon {
            font-size: 2em;
            margin: 10px 0;
        }

        .forecast-temp {
            font-size: 1.1em;
        }

        .error {
            background: #ff6b6b;
            color: white;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            margin: 20px 0;
            display: none;
        }

        .error.show {
            display: block;
            animation: slideIn 0.3s ease;
        }

        .loading {
            text-align: center;
            color: white;
            font-size: 1.2em;
            display: none;
        }

        .loading.show {
            display: block;
        }

        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid white;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 1.8em;
            }

            .search-bar {
                flex-direction: column;
            }

            .search-bar input {
                width: 100%;
            }

            .weather-grid {
                grid-template-columns: 1fr;
            }

            .details-grid {
                grid-template-columns: 1fr;
            }

            .forecast-items {
                grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            }
        }

        .location-btn {
            padding: 12px 20px;
            font-size: 0.9em;
            background-color: #4ecdc4;
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
            font-weight: 600;
        }

        .location-btn:hover {
            background-color: #45b7aa;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌤️ Weather Dashboard</h1>

        <div class="search-bar">
            <input 
                type="text" 
                id="cityInput" 
                placeholder="Enter city name..."
                autocomplete="off"
            >
            <button onclick="searchWeather()">Search</button>
            <button class="location-btn" onclick="getLocationWeather()">📍 Current Location</button>
        </div>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Fetching weather data...</p>
        </div>

        <div class="error" id="error"></div>

        <div class="weather-grid" id="weatherGrid"></div>

        <div class="forecast" id="forecastContainer" style="display: none;">
            <h3>5-Day Forecast</h3>
            <div class="forecast-items" id="forecastItems"></div>
        </div>
    </div>

    <script>
        const API_KEY = '8d5cb08b2d4af21ebd51854427615271'; // OpenWeatherMap free API key
        const BASE_URL = 'https://api.openweathermap.org/data/2.5';

        // Weather emoji mapping
        const weatherEmojis = {
            'clear sky': '☀️',
            'few clouds': '🌤️',
            'scattered clouds': '☁️',
            'broken clouds': '☁️',
            'overcast clouds': '🌥️',
            'light rain': '🌧️',
            'moderate rain': '🌧️',
            'heavy rain': '⛈️',
            'thunderstorm': '⛈️',
            'mist': '🌫️',
            'snow': '❄️',
            'rain': '🌧️',
            'drizzle': '🌦️',
            'default': '🌡️'
        };

        function getWeatherEmoji(description) {
            const desc = description.toLowerCase();
            for (let key in weatherEmojis) {
                if (desc.includes(key)) {
                    return weatherEmojis[key];
                }
            }
            return weatherEmojis['default'];
        }

        async function fetchWeather(lat, lon) {
            try {
                showLoading(true);
                hideError();

                // Fetch current weather
                const currentResponse = await fetch(
                    `${BASE_URL}/weather?lat=${lat}&lon=${lon}&appid=${API_KEY}&units=metric`
                );

                if (!currentResponse.ok) {
                    throw new Error('Weather data not found');
                }

                const currentData = await currentResponse.json();

                // Fetch forecast
                const forecastResponse = await fetch(
                    `${BASE_URL}/forecast?lat=${lat}&lon=${lon}&appid=${API_KEY}&units=metric`
                );
                const forecastData = await forecastResponse.json();

                showLoading(false);
                displayWeather(currentData);
                displayForecast(forecastData);

            } catch (error) {
                showLoading(false);
                showError(error.message);
            }
        }

        function displayWeather(data) {
            const grid = document.getElementById('weatherGrid');
            grid.innerHTML = '';

            const card = document.createElement('div');
            card.className = 'weather-card';

            const temp = Math.round(data.main.temp);
            const description = data.weather[0].description;
            const emoji = getWeatherEmoji(description);

            card.innerHTML = `
                <div class="weather-header">
                    <div class="city-info">
                        <h2>${data.name}, ${data.sys.country}</h2>
                        <p>${new Date().toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' })}</p>
                    </div>
                    <div class="temp-display">
                        <div class="temperature">${temp}°C</div>
                    </div>
                </div>

                <div class="weather-icon">${emoji}</div>
                <div class="weather-description">${description}</div>

                <div class="details-grid">
                    <div class="detail">
                        <div class="detail-label">Feels Like</div>
                        <div class="detail-value">${Math.round(data.main.feels_like)}°C</div>
                    </div>
                    <div class="detail">
                        <div class="detail-label">Humidity</div>
                        <div class="detail-value">${data.main.humidity}%</div>
                    </div>
                    <div class="detail">
                        <div class="detail-label">Wind Speed</div>
                        <div class="detail-value">${data.wind.speed} m/s</div>
                    </div>
                    <div class="detail">
                        <div class="detail-label">Pressure</div>
                        <div class="detail-value">${data.main.pressure} hPa</div>
                    </div>
                    <div class="detail">
                        <div class="detail-label">Visibility</div>
                        <div class="detail-value">${(data.visibility / 1000).toFixed(1)} km</div>
                    </div>
                    <div class="detail">
                        <div class="detail-label">UV Index</div>
                        <div class="detail-value">${data.clouds.all}% Clouds</div>
                    </div>
                </div>
            `;

            grid.appendChild(card);
        }

        function displayForecast(data) {
            const forecastContainer = document.getElementById('forecastContainer');
            const forecastItems = document.getElementById('forecastItems');
            forecastItems.innerHTML = '';

            // Get forecast for next 5 days (every 24 hours)
            const dailyForecasts = {};

            data.list.forEach(item => {
                const date = new Date(item.dt * 1000);
                const day = date.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });

                if (!dailyForecasts[day]) {
                    dailyForecasts[day] = item;
                }
            });

            Object.values(dailyForecasts).slice(0, 5).forEach(forecast => {
                const date = new Date(forecast.dt * 1000);
                const day = date.toLocaleDateString('en-US', { weekday: 'short' });
                const emoji = getWeatherEmoji(forecast.weather[0].description);
                const maxTemp = Math.round(forecast.main.temp_max);
                const minTemp = Math.round(forecast.main.temp_min);

                const item = document.createElement('div');
                item.className = 'forecast-item';
                item.innerHTML = `
                    <div class="forecast-day">${day}</div>
                    <div class="forecast-icon">${emoji}</div>
                    <div class="forecast-temp">${maxTemp}° / ${minTemp}°</div>
                `;
                forecastItems.appendChild(item);
            });

            forecastContainer.style.display = 'block';
        }

        async function searchWeather() {
            const city = document.getElementById('cityInput').value.trim();
            if (!city) {
                showError('Please enter a city name');
                return;
            }

            try {
                showLoading(true);
                hideError();

                const response = await fetch(
                    `${BASE_URL}/weather?q=${city}&appid=${API_KEY}&units=metric`
                );

                if (!response.ok) {
                    throw new Error('City not found');
                }

                const data = await response.json();
                fetchWeather(data.coord.lat, data.coord.lon);

            } catch (error) {
                showLoading(false);
                showError(error.message);
            }
        }

        function getLocationWeather() {
            if (!navigator.geolocation) {
                showError('Geolocation is not supported by your browser');
                return;
            }

            showLoading(true);
            hideError();

            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    fetchWeather(lat, lon);
                },
                (error) => {
                    showLoading(false);
                    showError('Unable to access your location. Please enable location permissions.');
                }
            );
        }

        function showLoading(show) {
            document.getElementById('loading').classList.toggle('show', show);
        }

        function showError(message) {
            const errorDiv = document.getElementById('error');
            errorDiv.textContent = message;
            errorDiv.classList.add('show');
        }

        function hideError() {
            document.getElementById('error').classList.remove('show');
        }

        // Allow Enter key to search
        document.getElementById('cityInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                searchWeather();
            }
        });

        // Load weather for a default city on page load
        window.addEventListener('load', () => {
            fetchWeather(40.7128, -74.0060); // New York City
        });
    </script>
</body>
</html>
